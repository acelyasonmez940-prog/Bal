<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐝 Bal AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header class="header">

<div class="logo">
<img src="28FC9A8C-9F3E-431C-BA2C-E07B25FCE3C7.png" alt="Bal" class="bal-logo">
</div>

<h1>Bal</h1>

<h1>🐝 Bal</h1>

<p id="headerStatus">Bugün benimle kim sohbet edecek? 🍯</p>

</header>

<section id="welcomeScreen" class="welcome">

<button class="user-card" id="userAci">
<h2>🩷 Açı</h2>
<span>Merhaba Bal 💗</span>
</button>

<button class="user-card blue" id="userBolatinyo">
<h2>💙 Bolatinyo</h2>
<span>Selam Bal 🍯</span>
</button>

</section>

<section id="chatScreen" class="chat-screen" style="display:none;">

<div id="messages" class="messages">
</div>

<div id="quickActions" class="quick-actions" style="display:none;">

<div class="quick-title">
💛 Belki bunlardan biri iyi gelebilir.
</div>

<div id="quickButtons"></div>

</div>

<div class="chat-input">

<input
id="messageInput"
type="text"
placeholder="Mesaj yaz..."
>

<button id="sendButton">
➜
</button>

</div>

</section>

</div>

<script type="module" src="balai.js"></script>

</body>
</html>
